name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check:sw diffs against the base branch to prove the offline cache
          # version was bumped whenever a cached asset changed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser download is ~150MB and unchanged between runs of the same
      # Playwright version, so cache it rather than re-downloading every push.
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Visual baselines are captured on Windows and are platform-specific
      # (Chromium renders text differently on Linux), so CI runs the
      # platform-independent functional suite. Run `npm run test:visual`
      # locally before release.
      - run: npm run check:ci

      - name: Service worker cache version
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run check:sw -- "origin/${{ github.base_ref }}"
          else
            npm run check:sw -- "${{ github.event.before }}"
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-output
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
